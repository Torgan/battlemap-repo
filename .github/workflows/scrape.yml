name: scrape-battlemaps

on:
  schedule:
    # Daily at 06:00 UTC. Also keeps the Supabase free project from auto-pausing.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      subreddit:
        description: "Limit to a single subreddit (optional)"
        required: false
        default: ""
      limit:
        description: "Max posts to fetch per source"
        required: false
        default: "50"

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run scraper
        env:
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          AI_TAGGING: ${{ secrets.AI_TAGGING }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.subreddit }}" ]; then ARGS="$ARGS --subreddit ${{ github.event.inputs.subreddit }}"; fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          python main.py $ARGS
